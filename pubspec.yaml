name: cooltrack_flutter
description: CoolTrack HVAC Maintenance - Flutter Migration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0
  google_maps_flutter: ^2.10.0
  fl_chart: ^0.70.0
  firebase_messaging: ^15.2.2
  firebase_core: ^3.11.0
  flutter_local_notifications: ^18.0.1
  signature: ^5.4.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env.local
    - assets/images/
    - assets/fonts/
